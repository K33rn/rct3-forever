; Peep Editor settings (keep this file next to d3d9.dll in the game folder)
[PeepEditor]
; Key that opens and closes the menu: F1-F12, Insert, Home, End, Delete, PageUp, PageDown, Pause, ScrollLock
ToggleKey=F9
; Menu size in percent
UiScalePercent=110
; 1 = the game ignores clicks and keys meant for the menu. Set to 0 if the game crashes on start with the mod
; (the menu still works; the game then also sees what you click on the menu)
HookGameInput=1
