; RCT3 Forever settings (keep this file next to RCT3Forever.exe and forever.dll)
[Game]
; The game folder (the one with RCT3plus.exe). Empty = found or asked for on the first start.
Folder=

[Forever]
; 1 = the Park & Peep Editor is built in (press the toggle key in a park)
PeepEditor=1
; 1 = the game runs RCT3 Forever's rewritten functions in place of its own; 0 = the original code (for comparing)
Rewrites=1
; 1 = parks saved with custom content this install doesn't have load instead of crashing (what's missing is left out)
GameFixes=1

[PeepEditor]
; Key that opens and closes the menu: F1-F12, Insert, Home, End, Delete, PageUp, PageDown, Pause, ScrollLock
ToggleKey=F9
; Menu size in percent
UiScalePercent=110
; 1 = the game ignores clicks and keys meant for the menu. Set to 0 if the game crashes on start
; (the menu still works; the game then also sees what you click on the menu)
HookGameInput=1
